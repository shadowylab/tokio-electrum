[workspace]
members = [
    "bdk-tokio-electrum",
    "testenv",
    "tokio-electrum",
]
default-members = ["tokio-electrum", "bdk-tokio-electrum"]
resolver = "2"

[workspace.package]
authors = ["Yuki Kishimoto <yukikishimoto@protonmail.com>"]
homepage = "https://github.com/shadowylab/tokio-electrum"
repository = "https://github.com/shadowylab/tokio-electrum.git"
license = "MIT"
rust-version = "1.85.0"

[workspace.dependencies]
futures-util = "0.3"
testenv = { path = "testenv" }
tokio = { version = "1", default-features = false }
tracing = "0.1"
